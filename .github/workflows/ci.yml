name: CI

# 这份文件随插件一起发布 —— 公开仓就是我所在的这棵树（插件根目录）。
# 跨平台支持不能只写在 README 里：三个系统都要跑一遍插件自己的测试（何时跑见下），
# 红的必须是「代码有问题」，而不是「测试写死了某个平台的路径」。
#
# 为什么 macOS 不跟每次 push 一起跑：GitHub 的 arm64 托管机常年被抢空，
# 实测近 18 条 macOS 腿只有 2 条真被分配，其余都是
# `The job was not acquired by Runner of type hosted even after multiple attempts`。
# 让它跟着每次 push 跑，换来的是一条与代码无关的红 —— 常红的红线等于没有线。
# 所以它挪到发布（tag）、每周定时与手动：日常 push 的信号交给 Windows 与 Ubuntu，
# 发布前那道门仍然有 macOS。（本地开发本来就在 macOS 上，改动先过真机。）
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 单测（含 hooks 命令在本机能否执行）
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: 安装器演练（不落盘）
        shell: bash
        run: python install.py --dry-run

  macos:
    name: macOS · 发布门
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 单测（含 hooks 命令在本机能否执行）
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: 安装器演练（不落盘）
        run: python install.py --dry-run
